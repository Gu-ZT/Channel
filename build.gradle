plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "TarsosDSP repository"
        url = "https://mvn.0110.be/releases"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
            '--enable-preview'
    ]
}

loom {
    accessWidenerPath = file("src/main/resources/channel.accesswidener")

    runs {
        client {
            client()
            ideConfigGenerated(true)
        }
        server {
            server()
            programArg '--nogui'
            ideConfigGenerated(true)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.x 起官方不再发布混淆映射（运行时即 Mojang 名），无需 mappings；
    // 因无重映射环节，模组依赖直接走 implementation，Fabric 官方模板同款
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("io.github.llamalad7:mixinextras-fabric:0.5.5")

    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    include 'io.github.jaredmdobson:concentus:1.0.2'

    // javax.annotation（Nullable / ParametersAreNonnullByDefault）注解，仅编译期需要
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// 展开 fabric.mod.json 中的 ${} 属性占位符
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             loader_version         : loader_version,
                             fabric_version         : fabric_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register("runWithRenderDoc", Exec) {
    def javaExecTask = tasks.withType(JavaExec).named("runClient").get()
    def javaHome = javaExecTask.javaLauncher.get().metadata.installationPath.asFile.absolutePath

    commandLine = [
            "C:\\Program Files\\RenderDoc\\renderdoccmd.exe",
            "capture",
            "--opt-hook-children",
            "--wait-for-exit",
            "--working-dir",
            ".",
            "$javaHome\\bin\\java.exe",
            "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005",
            "-Xmx64m",
            "-Xms64m",
            "-Dorg.gradle.appname=gradlew",
            "-Dorg.gradle.java.home=$javaHome",
            "-classpath",
            "gradle/wrapper/gradle-wrapper.jar",
            "org.gradle.wrapper.GradleWrapperMain",
            "runClient"
    ]
}

abstract class StripPreviewMinorTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getClassesDir()

    @TaskAction
    void strip() {
        File root = getClassesDir().get().asFile
        if (!root.exists()) return

        Deque<File> stack = new ArrayDeque<>()
        stack.push(root)
        while (!stack.isEmpty()) {
            File dir = stack.pop()
            File[] children = dir.listFiles()
            if (children == null) continue
            for (File f : children) {
                if (f.isDirectory()) {
                    stack.push(f)
                } else if (f.isFile() && f.name.endsWith('.class')) {
                    byte[] b = f.bytes
                    if (b.length >= 8
                            && (b[0] & 0xFF) == 0xCA && (b[1] & 0xFF) == 0xFE
                            && (b[2] & 0xFF) == 0xBA && (b[3] & 0xFF) == 0xBE) {
                        int minor = ((b[4] & 0xFF) << 8) | (b[5] & 0xFF)
                        int major = ((b[6] & 0xFF) << 8) | (b[7] & 0xFF)
                        if (major >= 56 && minor == 0xFFFF) {
                            b[4] = 0; b[5] = 0
                            println("striped preview minor version: " + f.name)
                        }
                    }
                }
            }
        }
    }
}

tasks.register('stripPreviewMinor', StripPreviewMinorTask) {
    dependsOn tasks.named('classes')
    classesDir.set(layout.buildDirectory.dir('classes/java/main'))
}

tasks.named('classes') {
    finalizedBy tasks.named('stripPreviewMinor')
}

abstract class JarFromScratchAlias extends DefaultTask {
    @Internal
    abstract RegularFileProperty getArchiveFile()
    @Internal
    abstract Property<String> getArchiveFileName()

    @TaskAction
    void report() {
        logger.lifecycle("jarFromScratch -> {}", archiveFile.get().asFile)
    }
}

tasks.register("jarFromScratch", JarFromScratchAlias) {
    dependsOn "jar"
    archiveFile.set(tasks.named("jar").flatMap { it.archiveFile })
    archiveFileName.set(tasks.named("jar").flatMap { it.archiveFileName })
}
